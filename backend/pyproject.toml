[project]
name = "edge-desk"
version = "0.1.0"
description = "Paper-trading engine for mispriced event contracts: prediction markets vs options-implied probabilities."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "orjson>=3.10",
  "numpy>=2.0",
  "scipy>=1.13",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
kumo = ["kumoai", "pandas"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edgedesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore:ORJSONResponse is deprecated", "ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM102", "RUF007", "FURB162", "SIM115", "RUF046", "RUF059", "E741"]
